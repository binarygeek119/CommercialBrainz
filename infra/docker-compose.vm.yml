# VM override: Caddy TLS on 80/443 → maintenance gate → api/web
services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  web:
    ports: !reset []

  api:
    ports: !reset []

  maintenance:
    image: ghcr.io/binarygeek119/commercialbrainz-maintenance:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.maintenance
    restart: unless-stopped
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "8080"
      FLAGS_DIR: /var/maintenance/flags
      STATUS_URL: http://api:8000/api/v1/site-status
      POLL_INTERVAL_SEC: "15"
    volumes:
      - ../data/maintenance:/var/maintenance/flags
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile.runtime:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      maintenance:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
