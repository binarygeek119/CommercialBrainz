# Auto-deploy CommercialBrainz to the GCE VM after CI succeeds.
#
# Branches / sites:
#   google     — https://commercialbrainz.duckdns.org/  (testing; default PR base)
#   cloudflare — https://commercialbrainz.org/            (public)
#
# CI pushes images to GHCR; this workflow pulls them on the VM.
# See docs/branches.md
#
# Auth: Workload Identity Federation (no JSON key secret).
# Optional repository variables:
#   GCP_PROJECT_ID  — default commercialbrainz
#   VM_NAME         — default commercialbrainz-vm
#
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [google, cloudflare]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (google or cloudflare)"
        required: true
        default: google
        type: choice
        options:
          - google
          - cloudflare

concurrency:
  group: deploy-gce-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCE VM
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'google' ||
        github.event.workflow_run.head_branch == 'cloudflare'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve branch and commit
        id: target
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/820871329461/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deploy@commercialbrainz.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'commercialbrainz' }}
          VM_NAME: ${{ vars.VM_NAME || 'commercialbrainz-vm' }}
          IMAGE_TAG: ${{ steps.target.outputs.sha }}
          APP_BRANCH: ${{ steps.target.outputs.branch }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-gcloud-vm.sh
          echo "Deploying APP_BRANCH=${APP_BRANCH} IMAGE_TAG=${IMAGE_TAG}"
          ./scripts/deploy-gcloud-vm.sh
