# Auto-deploy CommercialBrainz to the matching GCE VM after CI succeeds.
#
# Branches / sites / VMs:
#   google     — https://commercialbrainz.duckdns.org/  → commercialbrainz-vm
#   cloudflare — https://commercialbrainz.org/            → commercialbrainz-public
#
# CI pushes images to GHCR; this workflow pulls them on the target VM.
# See docs/branches.md
#
# Optional repository variables:
#   GCP_PROJECT_ID       — default commercialbrainz
#   VM_NAME_GOOGLE       — default commercialbrainz-vm
#   VM_NAME_CLOUDFLARE   — default commercialbrainz-public
#   VM_NAME              — legacy alias for the google/testing VM
#
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [google, cloudflare]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (google or cloudflare)"
        required: true
        default: google
        type: choice
        options:
          - google
          - cloudflare

concurrency:
  group: deploy-gce-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch || 'unknown' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCE VM
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'google' ||
        github.event.workflow_run.head_branch == 'cloudflare'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve branch and commit
        id: target
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target VM
        id: vm
        run: |
          set -euo pipefail
          branch="${{ steps.target.outputs.branch }}"
          if [[ "$branch" == "cloudflare" ]]; then
            name="${{ vars.VM_NAME_CLOUDFLARE }}"
            name="${name:-commercialbrainz-public}"
          else
            name="${{ vars.VM_NAME_GOOGLE }}"
            if [[ -z "$name" ]]; then
              name="${{ vars.VM_NAME }}"
            fi
            name="${name:-commercialbrainz-vm}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Target VM: ${name} (branch=${branch})"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/820871329461/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deploy@commercialbrainz.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'commercialbrainz' }}
          VM_NAME: ${{ steps.vm.outputs.name }}
          IMAGE_TAG: ${{ steps.target.outputs.sha }}
          APP_BRANCH: ${{ steps.target.outputs.branch }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-gcloud-vm.sh
          echo "Deploying APP_BRANCH=${APP_BRANCH} VM_NAME=${VM_NAME} IMAGE_TAG=${IMAGE_TAG}"
          ./scripts/deploy-gcloud-vm.sh
