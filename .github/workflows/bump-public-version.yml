# After each merge/push to public (production site), bump major.minor.bug
# (default: bug/patch +1) and tag. Skips its own bump commits.
name: Bump public version

on:
  push:
    branches: [public]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number to bump"
        required: true
        default: bug
        type: choice
        options:
          - bug
          - minor
          - major

concurrency:
  group: bump-public-version
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/public' &&
       !startsWith(github.event.head_commit.message, 'chore(public): bump version') &&
       !startsWith(github.event.head_commit.message, 'chore(cloudflare): bump version'))
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: public
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version files
        id: bump
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'bug' }}
        run: |
          set -euo pipefail
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh "$BUMP" | tee /tmp/bump.out
          next="$(grep '^NEXT_VERSION=' /tmp/bump.out | cut -d= -f2)"
          tag="$(grep '^NEXT_TAG=' /tmp/bump.out | cut -d= -f2)"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/version.ts frontend/package.json backend/pyproject.toml
          if git diff --cached --quiet; then
            echo "No version file changes (already at ${VERSION}?); ensuring tag exists"
          else
            git commit -m "chore(public): bump version to ${VERSION}"
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            git tag -a "${TAG}" -m "CommercialBrainz ${TAG} (public)"
          fi
          git push origin public
          git push origin "${TAG}"
